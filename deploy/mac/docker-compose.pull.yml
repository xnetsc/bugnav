services:
  bugnav:
    image: ghcr.io/xnetsc/bugnav:latest
    container_name: bugnav
    restart: unless-stopped
    environment:
      # No TZ here on purpose: the container adopts the robot's
      # own reported timezone at startup; log stamps and the
      # local-time fallback follow it.  Nothing is hardcoded.
      ECOVACS_ACCOUNT_ID: "${ECOVACS_ACCOUNT_ID:?set ECOVACS_ACCOUNT_ID in .env}"
      ECOVACS_PASSWORD: "${ECOVACS_PASSWORD:?set ECOVACS_PASSWORD in .env}"
      # Optional: LLM-assisted offline analysis (tools/analyze_episodes.py).
      # Leave unset to disable. Any OpenAI-compatible endpoint works.
      BUGNAV_LLM_API_KEY: "${BUGNAV_LLM_API_KEY:-}"
      BUGNAV_LLM_BASE_URL: "${BUGNAV_LLM_BASE_URL:-https://api.meta.ai/v1}"
      BUGNAV_LLM_MODEL: "${BUGNAV_LLM_MODEL:-muse-spark-1.3}"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
    # Default command in the image is observe mode. Switch to active only
    # after the verification checklist passes, by uncommenting:
    # Mode switch (default in the image is observe):
    # supervised = supervisor-issued safety commands (verdict
    # stop/return, ask pause, charge resume) execute for real;
    # controller navigation commands, pauses included, stay
    # shadow - this firmware rejects script-issued area commands
    # (20011), and a landed navigation pause alone parks the robot.
    # command: ["python", "-m", "bugnav.runner", "--config", "config.json", "--mode", "supervised"]
    # active = everything executes (needs the area dialect solved):
    # command: ["python", "-m", "bugnav.runner", "--config", "config.json", "--mode", "active"]
