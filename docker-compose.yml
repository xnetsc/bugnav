services:
  bugnav:
    build: .
    container_name: bugnav
    restart: unless-stopped
    environment:
      # Credentials live only in the host environment (or a .env file next
      # to this file) - never in code, never in config.json.
      ECOVACS_ACCOUNT_ID: "${ECOVACS_ACCOUNT_ID:?set ECOVACS_ACCOUNT_ID in the environment or .env}"
      ECOVACS_PASSWORD: "${ECOVACS_PASSWORD:?set ECOVACS_PASSWORD in the environment or .env}"
      # Optional: LLM-assisted offline analysis. Leave unset to disable.
      BUGNAV_LLM_API_KEY: "${BUGNAV_LLM_API_KEY:-}"
      BUGNAV_LLM_BASE_URL: "${BUGNAV_LLM_BASE_URL:-https://api.meta.ai/v1}"
      BUGNAV_LLM_MODEL: "${BUGNAV_LLM_MODEL:-muse-spark-1.3}"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
    # The daemon commands the robot for real (no shadow modes);
    # the image's default command is used unless overridden here.
